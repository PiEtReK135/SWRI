<header class="swri-header">
  <div class="swri-header-inner">
    <a class="swri-wordmark" href="/" aria-label="SWRI, strona główna">
      <span class="swri-brand-mark" aria-hidden="true"></span>SWRI
    </a>
    <swri-appearance></swri-appearance>
  </div>
</header>
<main class="login-page">
  <div class="login-panel" aria-labelledby="login-title">
    <a class="back-link" href="/">Wróć na stronę SWRI</a>
    <p class="login-context">Dashboard administratora</p>
    <h1 id="login-title">Zaloguj się</h1>
    <p class="login-note">Ekran demonstracyjny. Panel lokalny jest dostępny bez logowania.</p>

    <form (submit)="submit($event)">
      <label for="admin-email">Adres e-mail</label>
      <input id="admin-email" type="email" autocomplete="username" required>

      <label for="admin-password">Hasło</label>
      <input id="admin-password" type="password" autocomplete="current-password" required>

      <button type="submit">Zaloguj się</button>
    </form>

    <p class="login-status" role="status">
      @if (submitted()) {
        Formularz demonstracyjny nie sprawdza danych.
      }
    </p>
    <a class="swri-action swri-action-secondary dashboard-link" href="/dashboard">Otwórz panel InvestWatch</a>
  </div>
</main>
