name: InvestWatch CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-pol fonts-dejavu-core
      - run: python -m pip install pip==26.2.2 && python -m pip install -r requirements.txt -r requirements-ai.txt -r requirements-dev.txt
      - run: python -m unittest discover -v
      - run: node --check investwatch/web/app.js
      - run: python -m pip_audit
